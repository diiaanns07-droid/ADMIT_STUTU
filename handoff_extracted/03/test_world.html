<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASHEN OATH — world.js test</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1016; color: #cfd6e2; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; overflow: hidden; }
  canvas { display: block; }
  #hud { position: fixed; left: 8px; top: 8px; padding: 8px 10px; background: rgba(8, 10, 14, 0.72); border: 1px solid #2c3444; border-radius: 6px; max-width: 460px; white-space: pre-wrap; pointer-events: none; }
  #bar { position: fixed; right: 8px; top: 8px; display: flex; gap: 4px; flex-wrap: wrap; max-width: 420px; justify-content: flex-end; }
  #bar button { background: #1b2130; color: #d8c49a; border: 1px solid #3a4458; border-radius: 4px; padding: 3px 7px; font: inherit; cursor: pointer; }
  #bar button.on { background: #3a3222; }
  #err { position: fixed; left: 8px; bottom: 8px; color: #ff8a7a; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="hud">загрузка…</div>
<div id="bar"></div>
<div id="err"></div>
<script type="module">
// Автономный стенд для world.js (не импортирует основную игру).
// URL-параметры: three=<url three.module.js>  scene=start|strafe|cast|shield|burst|dash|hit|slam|slamhit|orb|orbhit|nova|novahit|stage2|dead|victory
//                t=<сек сценария>  cam=follow|front|side|wide  q=low|medium|high  shot=1 (один кадр, без rAF)  w/h=размер
const P = new URLSearchParams(location.search);
const errEl = document.getElementById('err');
window.addEventListener('error', (e) => { errEl.textContent += '\n' + e.message; });
window.addEventListener('unhandledrejection', (e) => { errEl.textContent += '\n' + (e.reason && e.reason.stack || e.reason); });

const THREE_URL = P.get('three') || 'https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js';
const THREE = await import(THREE_URL);
const { createWorld, API_VERSION } = await import('./world.js?v=' + Date.now());

const SHOT = P.get('shot') === '1';
const W = +P.get('w') || innerWidth, Hh = +P.get('h') || innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: SHOT });
renderer.setPixelRatio(SHOT ? 1 : Math.min(devicePixelRatio, 2));
renderer.setSize(W, Hh);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = +P.get('exp') || 1.0;
if ('outputColorSpace' in renderer) renderer.outputColorSpace = THREE.SRGBColorSpace; else renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(58, W / Hh, 0.1, 240);

const world = createWorld({ THREE, scene, renderer, camera, config: { world: { quality: P.get('q') || 'medium' } } });

/* ---------------------- поддельный combat-снимок ---------------------- */
let sim, evId = 1, pending = [], timers;
function resetSim() {
  sim = {
    status: 'playing',
    player: { position: { x: 0, y: 0, z: 6 }, yaw: Math.PI, hp: 100, maxHp: 100, energy: 100, maxEnergy: 100, action: 'idle', invulnerable: false, shielding: false },
    boss: { position: { x: 0, y: 0, z: 0 }, yaw: 0, hp: 1000, maxHp: 1000, stage: 1, action: 'idle' },
    cooldowns: {}, projectiles: [], telegraphs: [], stats: {},
  };
  timers = { act: 0, boss: 0, bossPhase: null, kind: 'slam', theta: 0, R: 6, dash: 0, dashDir: 0 };
  pending = [];
}
resetSim();
const emit = (type, data = {}, position) => pending.push({ id: evId++, type, position: position || { ...sim.player.position }, data });
const keys = new Set();
const input = { moveX: 0, moveY: 0, shield: false };

function playerAct(a, dur) { sim.player.action = a; timers.act = dur; }
const A = {
  cast() { if (sim.status !== 'playing') return; playerAct('cast', 0.3); emit('player_cast', { kind: 'bolt' }); },
  burst() { if (sim.status !== 'playing') return; playerAct('cast', 0.6); emit('burst', {}); },
  dash(dir) { if (sim.status !== 'playing') return; playerAct('dash', 0.25); timers.dash = 0.25; timers.dashDir = dir; emit('player_dash', { direction: dir }); },
  hitPlayer() { if (sim.status !== 'playing') return; sim.player.hp = Math.max(1, sim.player.hp - 10); playerAct('hit', 0.3); emit('player_hit', { damage: 10 }); },
  hitBoss() { if (sim.status !== 'playing') return; sim.boss.hp = Math.max(1, sim.boss.hp - 60); if (sim.boss.action === 'idle') { sim.boss.action = 'hit'; timers.boss = 0.25; timers.bossPhase = 'hit'; } emit('boss_hit', { damage: 60 }, { x: 0, y: 3, z: 0.6 }); },
  windup(kind) {
    if (sim.status !== 'playing' || sim.boss.action === 'windup') return;
    timers.kind = kind; timers.bossPhase = 'windup'; timers.boss = 1.2; sim.boss.action = 'windup';
    const tgt = kind === 'nova' ? { x: 0, y: 0, z: 0 } : { ...sim.player.position };
    sim.telegraphs = [{ id: 't' + evId, kind, origin: { x: 0, y: 0, z: 0 }, target: tgt, radius: kind === 'slam' ? 3 : kind === 'nova' ? 8 : 1, remaining: 1.2, duration: 1.2, blockable: kind === 'orb' }];
    emit('boss_windup', { attackKind: kind, duration: 1.2 }, { x: 0, y: 0, z: 0 });
  },
  phase2() { if (sim.boss.stage === 2) return; sim.boss.stage = 2; sim.boss.hp = Math.min(sim.boss.hp, 490); emit('boss_phase', { stage: 2 }, { x: 0, y: 0, z: 0 }); },
  victory() { sim.status = 'victory'; sim.boss.hp = 0; sim.boss.action = 'dead'; sim.telegraphs = []; emit('victory', {}); },
  defeat() { sim.status = 'defeat'; sim.player.hp = 0; sim.player.action = 'dead'; emit('defeat', {}); },
  reset() { resetSim(); world.reset(); },
};

function stepSim(dt) {
  const p = sim.player, b = sim.boss;
  if (sim.status === 'playing') {
    const sp = 3.6;
    let mx = input.moveX, my = input.moveY;
    if (timers.dash > 0) { timers.dash -= dt; mx = timers.dashDir * 3.9; my = 0; }
    timers.theta += (mx * sp / Math.max(2, timers.R)) * dt;
    timers.R = Math.min(9.5, Math.max(3, timers.R - my * sp * dt));
    p.position = { x: Math.sin(timers.theta) * timers.R, y: 0, z: Math.cos(timers.theta) * timers.R };
    p.yaw = timers.theta + Math.PI;
    b.yaw = timers.theta;
    if (input.shield !== p.shielding) { p.shielding = input.shield; emit(input.shield ? 'shield_start' : 'shield_end', {}); }
    if (timers.act > 0) { timers.act -= dt; if (timers.act <= 0) p.action = 'idle'; }
    if (timers.act <= 0) p.action = p.shielding ? 'shield' : (Math.abs(mx) + Math.abs(my) > 0.01 ? 'move' : 'idle');
    // босс
    if (timers.bossPhase) {
      timers.boss -= dt;
      for (const t of sim.telegraphs) t.remaining = Math.max(0, t.remaining - dt);
      if (timers.boss <= 0) {
        if (timers.bossPhase === 'windup') { timers.bossPhase = 'attack'; timers.boss = 0.35; b.action = 'attack'; sim.telegraphs = []; emit('boss_impact', { attackKind: timers.kind }, { x: 0, y: 0, z: 2 }); }
        else if (timers.bossPhase === 'attack') { timers.bossPhase = 'recover'; timers.boss = 0.8; b.action = 'recover'; }
        else { timers.bossPhase = null; b.action = 'idle'; }
      }
    }
  }
}

/* ------------------------------ сценарии ------------------------------ */
const SCN = {
  start: { t: 1.2, at: [] },
  strafe: { t: 1.3, hold: { moveX: 1 } },
  cast: { t: 0.92, at: [[0.8, 'cast']] },
  shield: { t: 1.2, hold: { shield: true } },
  burst: { t: 1.05, at: [[0.5, 'burst']] },
  gather: { t: 0.8, at: [[0.5, 'burst']] },
  dash: { t: 0.64, at: [[0.5, 'dash', 1]] },
  hit: { t: 0.62, at: [[0.5, 'hitPlayer'], [0.5, 'hitBoss']] },
  slam: { t: 1.5, at: [[0.5, 'windup', 'slam']] },
  slamhit: { t: 1.82, at: [[0.5, 'windup', 'slam']] },
  orb: { t: 1.5, at: [[0.5, 'windup', 'orb']] },
  orbhit: { t: 1.82, at: [[0.5, 'windup', 'orb']] },
  nova: { t: 1.5, at: [[0.5, 'windup', 'nova']] },
  novahit: { t: 1.82, at: [[0.5, 'windup', 'nova']] },
  stage2: { t: 3.2, at: [[0.3, 'phase2']] },
  roar: { t: 1.0, at: [[0.3, 'phase2']] },
  dead: { t: 3.4, at: [[0.3, 'defeat']] },
  victory: { t: 5.5, at: [[0.3, 'victory']] },
};

/* ------------------------------- камера ------------------------------- */
const camMode = { v: P.get('cam') || 'follow' };
const _f = new THREE.Vector3(), _t = new THREE.Vector3(), _c = new THREE.Vector3();
function placeCamera(dt, snap = true) {
  const p = sim.player.position, yaw = sim.player.yaw;
  _f.set(Math.sin(yaw), 0, Math.cos(yaw));
  if (camMode.v === 'front') { _c.set(p.x + _f.x * 2.6, 1.55, p.z + _f.z * 2.6); _t.set(p.x, 1.15, p.z); }
  else if (camMode.v === 'side') { _c.set(p.x - _f.z * 3.2 + _f.x * 0.4, 1.4, p.z + _f.x * 3.2 + _f.z * 0.4); _t.set(p.x, 1.0, p.z); }
  else if (camMode.v === 'boss') { _c.set(p.x - _f.x * 1.5 + 2, 2.2, p.z - _f.z * 1.5); _t.set(0, 3.0, 0); }
  else if (camMode.v === 'wide') { _c.set(15, 13, 21); _t.set(0, 1.2, 0); }
  else { _c.set(p.x - _f.x * 4.3, 2.35, p.z - _f.z * 4.3); _t.set(p.x + _f.x * 3.5, 1.7, p.z + _f.z * 3.5); }
  if (snap) camera.position.copy(_c); else camera.position.lerp(_c, 1 - Math.exp(-10 * dt));
  camera.lookAt(_t);
}

/* ------------------------------ измерения ------------------------------ */
let updMs = 0, updN = 0;
function worldStep(dt) {
  stepSim(dt);
  const evs = pending; pending = [];
  const t0 = performance.now();
  world.update(dt, sim, evs);
  updMs += performance.now() - t0; updN++;
}
function screenBox(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  const pts = [];
  for (const x of [box.min.x, box.max.x]) for (const y of [box.min.y, box.max.y]) for (const z of [box.min.z, box.max.z]) pts.push(new THREE.Vector3(x, y, z));
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const v of pts) { v.project(camera); const sx = (v.x * 0.5 + 0.5) * W, sy = (-v.y * 0.5 + 0.5) * Hh; x0 = Math.min(x0, sx); y0 = Math.min(y0, sy); x1 = Math.max(x1, sx); y1 = Math.max(y1, sy); }
  return { x0, y0, x1, y1 };
}
const find = (name) => world.root.getObjectByName(name);
window.__ashenTest = {
  world, renderer, scene, camera, sim: () => sim, A,
  boxes() { return { hero: screenBox(find('hero-body')), boss: screenBox(find('boss-body')) }; },
  info() { return { calls: renderer.info.render.calls, triangles: renderer.info.render.triangles, geometries: renderer.info.memory.geometries, textures: renderer.info.memory.textures, programs: renderer.info.programs ? renderer.info.programs.length : -1, updateMs: updN ? updMs / updN : 0, three: THREE.REVISION, api: world.apiVersion }; },
  anchors: () => world.getAnchors(),
  benchUpdate(n = 300) { const t0 = performance.now(); for (let i = 0; i < n; i++) worldStep(1 / 60); return (performance.now() - t0) / n; },
};

/* ------------------------------- UI/HUD ------------------------------- */
const hud = document.getElementById('hud'), bar = document.getElementById('bar');
function btn(label, fn) { const b = document.createElement('button'); b.textContent = label; b.onclick = () => { fn(); b.blur(); }; bar.appendChild(b); return b; }
const qBtns = {};
for (const q of ['low', 'medium', 'high']) qBtns[q] = btn(q, () => { world.setQuality(q); for (const k in qBtns) qBtns[k].classList.toggle('on', k === q); });
qBtns[P.get('q') || 'medium'].classList.add('on');
for (const c of ['follow', 'front', 'side', 'boss', 'wide']) btn('cam:' + c, () => { camMode.v = c; });
btn('dispose→recreate', () => { world.dispose(); location.reload(); });
const KEYMAP = { KeyJ: () => A.cast(), KeyL: () => A.burst(), KeyQ: () => A.dash(-1), KeyE: () => A.dash(1), KeyH: () => A.hitPlayer(), KeyB: () => A.hitBoss(),
  Digit1: () => A.windup('slam'), Digit2: () => A.windup('orb'), Digit3: () => A.windup('nova'), KeyP: () => A.phase2(), KeyV: () => A.victory(), KeyX: () => A.defeat(), KeyR: () => A.reset() };
addEventListener('keydown', (e) => { if (e.repeat) return; keys.add(e.code); if (KEYMAP[e.code]) KEYMAP[e.code](); });
addEventListener('keyup', (e) => keys.delete(e.code));
function readInput() {
  input.moveX = (keys.has('KeyD') || keys.has('ArrowRight') ? 1 : 0) - (keys.has('KeyA') || keys.has('ArrowLeft') ? 1 : 0);
  input.moveY = (keys.has('KeyW') || keys.has('ArrowUp') ? 1 : 0) - (keys.has('KeyS') || keys.has('ArrowDown') ? 1 : 0);
  input.shield = keys.has('KeyK');
}
addEventListener('resize', () => { if (SHOT) return; renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

/* ------------------------------ запуск ------------------------------ */
const scnName = P.get('scene');
if (scnName && SCN[scnName]) {
  const S = SCN[scnName];
  const T = +P.get('t') || S.t;
  const dt = 1 / 60;
  const at = (S.at || []).map((a) => ({ time: a[0], fn: a[1], arg: a[2], done: false }));
  for (let t = 0; t < T; t += dt) {
    Object.assign(input, { moveX: 0, moveY: 0, shield: false }, S.hold || {});
    for (const a of at) if (!a.done && t >= a.time) { a.done = true; A[a.fn](a.arg); }
    worldStep(dt);
  }
  updMs = 0; updN = 0;
  worldStep(0);
}
placeCamera(0, true);
if (SHOT) {
  renderer.render(scene, camera);
  document.title = 'READY';
} else {
  let last = performance.now(), acc = 0, frames = 0, fps = 0;
  renderer.setAnimationLoop(() => {
    const now = performance.now();
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    readInput();
    worldStep(dt);
    placeCamera(dt, false);
    renderer.render(scene, camera);
    acc += dt; frames++;
    if (acc > 0.5) {
      fps = frames / acc; acc = 0; frames = 0;
      const i = window.__ashenTest.info();
      hud.textContent = `ASHEN OATH world.js · ${i.api} · three r${i.three}\n` +
        `fps ${fps.toFixed(0)} · calls ${i.calls} · tris ${i.triangles} · world.update ${i.updateMs.toFixed(2)} ms\n` +
        `status ${sim.status} · hero ${sim.player.action} · boss ${sim.boss.action} st${sim.boss.stage} · q ${world.quality}\n` +
        `A/D стрейф  W/S ближе/дальше  J каст  K щит(удерж.)  L burst  Q/E рывок\n` +
        `H удар по герою  B удар по боссу  1/2/3 slam/orb/nova  P фаза 2  V победа  X поражение  R сброс`;
      updMs = 0; updN = 0;
    }
  });
}
</script>
</body>
</html>
