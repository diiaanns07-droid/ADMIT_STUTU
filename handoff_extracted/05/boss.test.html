<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ASHEN OATH — boss.js tests</title>
<style>
  body { background: #16181b; color: #d8d4c8; font: 13px/1.45 ui-monospace, Consolas, monospace; margin: 16px; }
  pre { white-space: pre-wrap; }
  .ok { color: #c9b27a; } .bad { color: #e08a5a; }
</style>
</head>
<body>
<p>boss.js — исполнимые тесты (запуск через localhost, не file://). DEBUG / НЕ CV.</p>
<pre id="out">Выполняется…</pre>
<script type="module">
import { runBossTests } from './boss.test.js';
const out = document.getElementById('out');
try {
  const r = runBossTests();
  out.textContent = r.text;
  out.className = r.passed === r.total ? 'ok' : 'bad';
  console.log(r.text);
} catch (e) {
  out.textContent = 'Ошибка запуска тестов: ' + (e && e.stack ? e.stack : e);
  out.className = 'bad';
}
</script>
</body>
</html>
