<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASHEN OATH — стенд «Сияющий лес» [FOREST]</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1016; color: #cfd6e2; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; overflow: hidden; }
  canvas { display: block; }
  #hud { position: fixed; left: 8px; top: 8px; padding: 6px 9px; background: rgba(8, 10, 14, 0.6); border-radius: 6px; white-space: pre-wrap; pointer-events: none; }
  #err { position: fixed; left: 8px; bottom: 8px; color: #ff8a7a; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="hud">загрузка…</div>
<div id="err"></div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/" } }
</script>
<script type="module">
// [FOREST] Стенд зоны без остального мира: рельеф из brightForestHeight, солнце с тенью, полусфера,
// bloom (порог 1.0, как в игре). Для быстрых снимков и замеров строителей леса.
// URL: q=low|medium|high  b=<путь к модулю с доп. строителем (export default fn(ctx))>  hud=0  bloom=0
//   cam=x,y,z,tx,ty,tz — камера; hero=x,z — герой (маркер и примятие травы)
// window.__STAND__ = { forest, step(n,dt), cam(...), hero(x,z), bench(n), stats() }
import * as THREE from 'three';
import { createBrightForest, brightForestHeight, BRIGHT_FOREST } from '../modules/brightForest.js';
const P = new URLSearchParams(location.search);
const errEl = document.getElementById('err'), hud = document.getElementById('hud');
if (P.get('hud') === '0') hud.style.display = 'none';
window.addEventListener('error', (e) => { errEl.textContent += '\n' + e.message; });
const q = P.get('q') || 'medium';
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd0e0);
scene.fog = new THREE.Fog(0xa8d8cc, 70, 480);
const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.1, 1200);
scene.add(camera);
const BF = BRIGHT_FOREST;
// рельеф: за зоной — ровно на уровне леса
const y0 = (x, z) => BF.level - 0.5 + 0.8 * Math.sin(x * 0.03) * Math.cos(z * 0.027);
const groundY = (x, z) => brightForestHeight(x, z, y0(x, z));
{
  const S = 2 * (BF.r + 40), N = 220;
  const g = new THREE.PlaneGeometry(S, S, N, N); g.rotateX(-Math.PI / 2);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { const x = p.getX(i) + BF.x, z = p.getZ(i) + BF.z; p.setXYZ(i, x, groundY(x, z), z); }
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0x5f8f4a, roughness: 0.95 }));
  m.receiveShadow = true; scene.add(m);
}
const sunDir = new THREE.Vector3(-0.1, 0.42, -0.9).normalize();
const sun = new THREE.DirectionalLight(0xffe6b0, 3.4);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 10, far: 200 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.035;
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight(0x9cc8ff, 0x3a5a30, 1.2));
const atmosphere = { sunDir, useEnv() {} };
let extra = [];
if (P.get('b')) { const m = await import(P.get('b')); extra = [m.default || m.build].filter(Boolean); }
const t0 = performance.now();
const forest = createBrightForest({ THREE, parent: scene, groundY, quality: q, camera, atmosphere, builders: extra });
const buildMs = performance.now() - t0;
const heroM = new THREE.Mesh(new THREE.CapsuleGeometry(0.35, 1.1, 4, 8), new THREE.MeshStandardMaterial({ color: 0x223044, roughness: 0.6 }));
heroM.castShadow = true; scene.add(heroM);
const hero = { x: BF.start.x, z: BF.start.z };
let camV = null;
function place() {
  const y = groundY(hero.x, hero.z);
  heroM.position.set(hero.x, y + 0.9, hero.z);
  sun.target.position.set(hero.x, y, hero.z); sun.position.copy(sun.target.position).addScaledVector(sunDir, 90);
  if (camV) { camera.position.set(camV[0], camV[1], camV[2]); camera.lookAt(camV[3], camV[4], camV[5]); }
  else { camera.position.set(hero.x + 0.8, y + 2.9, hero.z + 5.2); camera.lookAt(hero.x, y + 1.3, hero.z - 4); }
}
if (P.get('cam')) camV = P.get('cam').split(',').map(Number);
if (P.get('hero')) { const [x, z] = P.get('hero').split(',').map(Number); hero.x = x; hero.z = z; }
let composer = null;
if (P.get('bloom') !== '0') {
  try {
    const { EffectComposer } = await import('three/addons/postprocessing/EffectComposer.js');
    const { RenderPass } = await import('three/addons/postprocessing/RenderPass.js');
    const { UnrealBloomPass } = await import('three/addons/postprocessing/UnrealBloomPass.js');
    const { OutputPass } = await import('three/addons/postprocessing/OutputPass.js');
    composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type: THREE.HalfFloatType }));
    composer.addPass(new RenderPass(scene, camera));
    composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth / 2, innerHeight / 2), 0.7, 0.42, 1.0));
    composer.addPass(new OutputPass());
  } catch (e) { console.warn('bloom', e); composer = null; }
}
function render(dt) { if (composer) composer.render(dt); else renderer.render(scene, camera); }
function step(n = 1, dt = 1 / 30) {
  for (let i = 0; i < n; i++) { place(); forest.update(dt, { x: hero.x, y: groundY(hero.x, hero.z), z: hero.z }); render(dt); }
  return { calls: renderer.info.render.calls, tris: renderer.info.render.triangles };
}
function bench(n = 30) {
  const gl = renderer.getContext(), px = new Uint8Array(4);
  const t = performance.now(); let calls = 0, tris = 0;
  for (let i = 0; i < n; i++) {
    place(); forest.update(1 / 60, { x: hero.x, y: groundY(hero.x, hero.z), z: hero.z });
    renderer.info.autoReset = false; renderer.info.reset(); render(1 / 60);
    calls = renderer.info.render.calls; tris = renderer.info.render.triangles; renderer.info.autoReset = true;
    gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
  }
  return { msPerFrame: +((performance.now() - t) / n).toFixed(2), calls, tris };
}
window.__STAND__ = { forest, THREE, scene, renderer, camera, step, bench, groundY,
  cam: (...v) => { camV = v.length ? v : null; place(); }, hero: (x, z) => { hero.x = x; hero.z = z; place(); },
  stats: () => ({ buildMs: +buildMs.toFixed(0), ...forest.stats(), calls: renderer.info.render.calls, tris: renderer.info.render.triangles }) };
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  step(1, dt);
  hud.textContent = `Сияющий лес · q=${q} · постройка ${buildMs.toFixed(0)} мс · вызовов ${renderer.info.render.calls} · ${(renderer.info.render.triangles / 1000).toFixed(0)}k треуг.`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
