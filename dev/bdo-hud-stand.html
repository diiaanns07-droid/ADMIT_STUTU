<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASHEN OATH — стенд боевого HUD [BDO]</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="../modules/ui.css">
<style>
  /* Стенд боевого HUD без WebGL: фальшивая 2D-сцена + настоящие ui.js (HUD), battleHud.js и bdoHud.js.
     Параметры: ?s=explore|engaged|pvp|coach|lowhp|intro|paused|zone|dead  &bdo=0  &rm=1  &t=секунды (заморозить время)
     &steer=0 — индикатор джойстика вместо руля; &hold=shield — «Руль» со щитом (герой стоит) */
  #ao-canvas { background: #0d0f14; }
</style>
</head>
<body>
<div id="ao-app">
  <canvas id="ao-canvas" aria-hidden="true"></canvas>
  <canvas id="ao-hud-canvas" aria-hidden="true"></canvas>
  <div id="ao-ui-root"></div>
</div>
<script type="module">
import { createUI } from '../modules/ui.js';
import { createBattleHud } from '../core/battleHud.js';
import { makeSnapshot } from './ui-fixtures.js';

const q = new URLSearchParams(location.search);
const S = q.get('s') || 'engaged';
const bdoUi = q.get('bdo') !== '0';
const rm = q.get('rm') === '1';
const freezeT = q.has('t') ? +q.get('t') : null;
const settings = { quality: 'medium', volume: 0.6, reducedMotion: rm, sensitivity: 1, moveMode: q.get('steer') === '0' ? 'stick' : 'steer', hero: 'ashen', bdoUi };
window.__STAND__ = { ready: false };

// ---------------------------------------------------------------- фальшивая раскладка мира (как world.layout)
const K = 1;
const LAYOUT = {
  version: 1, bounds: { minX: -262, maxX: 262, minZ: -262, maxZ: 262 }, worldEdge: 238,
  arena: { x: 0, z: 0, r: 13, leash: 6 }, bossHome: { x: 0, z: 0 }, playerSpawn: { x: 0, z: 26, yaw: Math.PI },
  landmarks: [
    { id: 'arena', kind: 'landmark', name: 'Арена Регента', x: 0, y: 0, z: 0, r: 13 },
    { id: 'shrine', kind: 'landmark', name: 'Врата святилища', x: -20, y: -1, z: -52, r: 17 },
    { id: 'city', kind: 'landmark', name: 'Нижний город', x: 96, y: 0, z: 96, r: 50 },
    { id: 'forest', kind: 'landmark', name: 'Пепельный лес', x: -142, y: 0, z: 4, r: 72 },
    { id: 'lake', kind: 'landmark', name: 'Зеркальное озеро', x: -80, y: 0, z: 110, r: 30 },
    { id: 'graves', kind: 'landmark', name: 'Кладбище колоссов', x: 140, y: 0, z: -95, r: 46 },
    { id: 'hill', kind: 'landmark', name: 'Холм клятвы', x: -95, y: 22, z: -140, r: 14 },
    { id: 'gate', kind: 'landmark', name: 'Павшие врата', x: 0, y: 0, z: 214, r: 16 },
    { id: 'elves', kind: 'landmark', name: 'Эльфийская деревня', x: 170, y: 0, z: 20, r: 40 },
    { id: 'bright-forest', kind: 'landmark', name: 'Сияющий лес', x: 150, y: 0, z: 160, r: 45 },
  ],
  roads: [
    [[20, 22], [50, 52], [72, 74], [96, 96]], [[-24, 6], [-44, 4], [-80, -6], [-112, 4], [-142, 4]],
    [[-22, 26], [-44, 56], [-58, 78], [-61.8, 84.9]], [[18, -14], [52, -22], [80, -55], [110, -80], [140, -95]],
    [[-14, -40], [-50, -70], [-72, -102], [-88, -126], [-95, -140]], [[0, 36], [4, 90], [-4, 150], [0, 230]],
    [[96, 96], [138, 46], [152, -20], [140, -95]], [[-142, 4], [-122, 50], [-100, 85]], [[22, 4], [70, 6], [118, 10], [150, 18]],
  ].map((pl) => pl.map(([x, z]) => ({ x, z }))),
  pois: [
    { id: 'ember-0', kind: 'ember', x: 30, y: 0, z: 40, r: 2.2 }, { id: 'ember-1', kind: 'ember', x: -60, y: 0, z: 10, r: 2.2 },
    { id: 'ember-2', kind: 'ember', x: 90, y: 0, z: -40, r: 2.2 }, { id: 'ember-3', kind: 'ember', x: -120, y: 0, z: 60, r: 2.2 },
  ],
  colliders: [],
};

// ---------------------------------------------------------------- фальшивая камера и сцена
const canvas = document.getElementById('ao-canvas');
const cam = { x: 0, y: 2.8, z: 11, yaw: Math.PI, f: 1 };
function project(p) {
  const W = innerWidth, H = innerHeight;
  const dx = p.x - cam.x, dz = p.z - cam.z, dy = (p.y || 0) - cam.y;
  const s = Math.sin(cam.yaw), c = Math.cos(cam.yaw);
  const rx = dx * c - dz * s, rz = -(dx * s + dz * c);   // вперёд = -Z камеры
  const depth = -rz;
  const fpx = H * 0.9;
  return { x: W / 2 + (rx / Math.max(0.1, depth)) * fpx, y: H * 0.5 - ((dy + 0.4) / Math.max(0.1, depth)) * fpx, behind: depth <= 0.1 };
}
function paintScene(snap) {
  const dpr = Math.min(devicePixelRatio || 1, 1.5), W = innerWidth, H = innerHeight;
  if (canvas.width !== Math.round(W * dpr)) { canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr); }
  const g = canvas.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#141a24'); sky.addColorStop(0.5, '#252b35'); sky.addColorStop(0.62, '#1b1d22'); sky.addColorStop(1, '#0f1013');
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  g.fillStyle = 'rgba(190,205,230,0.12)'; g.beginPath(); g.arc(W * 0.52, H * 0.16, H * 0.05, 0, 6.3); g.fill();
  g.fillStyle = '#16181d';
  for (let i = 0; i < 11; i++) { const x = (i / 10) * W; const ch = H * (0.14 + (i % 3) * 0.06); g.fillRect(x - 12, H * 0.6 - ch, 24, ch); }
  g.fillStyle = '#2a2c31'; g.beginPath(); g.ellipse(W / 2, H * 0.8, W * 0.55, H * 0.24, 0, 0, 6.3); g.fill();
  // босс и герой — силуэты там, куда их проецирует фальшивая камера
  const b = project({ ...snap.boss.position, y: 0 }), bt = project({ ...snap.boss.position, y: 6.5 });
  if (!b.behind) { g.fillStyle = '#3a2420'; const w = (b.y - bt.y) * 0.42; g.fillRect(b.x - w / 2, bt.y, w, b.y - bt.y); g.fillStyle = '#e07040'; g.beginPath(); g.arc(b.x, bt.y + (b.y - bt.y) * 0.3, w * 0.12, 0, 6.3); g.fill(); }
  const h = project({ ...snap.player.position, y: 0 }), ht = project({ ...snap.player.position, y: 1.8 });
  if (!h.behind) { g.fillStyle = '#5a6272'; const w = (h.y - ht.y) * 0.36; g.fillRect(h.x - w / 2, ht.y, w, h.y - ht.y); }
}

// ---------------------------------------------------------------- состояние стенда
const pvp = S === 'pvp';
let snap = makeSnapshot({
  player: { position: { x: 0, y: 0, z: S === 'explore' || S === 'zone' ? 30 : 7 }, hp: S === 'lowhp' ? 18 : 82, energy: 64, encounter: S === 'explore' || S === 'zone' ? 'explore' : 'engaged', lockedOn: S !== 'explore', combo: 7, comboMultiplier: 1.35, comboTimer: 2, moveMode: settings.moveMode, speed: 3.2, sprint: 0 },
  boss: { hp: 610, maxHp: 1000, stage: S === 'lowhp' ? 2 : 1, action: 'idle' },
  cooldowns: {
    dashRemaining: 0.6, dashTotal: 1.2, burstRemaining: 4.2, burstTotal: 8, throwRemaining: 0, throwTotal: 2.5,
    sparkRemaining: 0.3, sparkTotal: 0.6, slashRemaining: 0, slashTotal: 1.4, parryRemaining: 0, parryTotal: 1.6,
    runes: Object.fromEntries(['ignis', 'fulgur', 'orbis', 'stella', 'spira', 'lemnis', 'caret', 'vee', 'clepsydra', 'alpha'].map((k, i) => [k, { remaining: i % 3 === 0 ? 3 + i : 0, total: 10 + i }])),
    sigils: Object.fromEntries(['clap', 'gate', 'frame', 'delta', 'cor'].map((k, i) => [k, { remaining: i === 1 ? 6 : 0, total: 12 }])),
  },
  telegraphs: S === 'engaged' ? [{ id: 't1', kind: 'slam', origin: { x: 0, y: 0, z: 0 }, target: { x: 0, y: 0, z: 6 }, center: { x: 0, y: 0, z: 6 }, radius: 3, remaining: 1.1, duration: 1.8, blockable: false, damage: 24 }] : [],
});
if (pvp) {
  snap.mode = 'pvp';
  snap.opponent = { id: 'peer-2', name: 'Кайрен', hero: 'elf', position: { x: 1.5, y: 0, z: 0.5 }, yaw: 0, hp: 132, maxHp: 200, energy: 60, maxEnergy: 100, action: 'idle', shielding: false, invulnerable: false, stunned: false, slowed: true };
  snap.lockTarget = { position: { x: 1.5, y: 0, z: 0.5 }, kind: 'player' };
} else if (snap.player.encounter === 'engaged') {
  snap.lockTarget = { position: { x: 0, y: 0, z: 0 }, kind: 'boss' };
}
if (S === 'dead') { snap.boss.hp = 0; snap.boss.action = 'dead'; }

function inputAt(t) {
  const steer = settings.moveMode === 'steer';
  return {
    valid: true, source: 'cv', moveX: 0.2 * Math.sin(t), moveZ: 0.6,
    hint: S === 'coach' ? { code: 'ok_ring_open', gesture: 'Снаряд «OK»', text: 'Сомкни кончики большого и указательного в кольцо', side: 'right' } : null,
    stick: steer
      ? { mode: 'steer', hand: true, engaged: true, turn: 0.35 * Math.sin(t * 0.7), fwd: 0.7, gait: 'walk', x: 0.35 * Math.sin(t * 0.7), z: 0.7, level: -0.2, levels: { walkOn: -0.55, walkOff: -0.72, runOn: 0.05, runOff: -0.12 }, turnZone: { dzOn: 0.2, dzOff: 0.13, full: 0.62 }, ...(q.get('hold') === 'shield' ? { hold: 'shield', fwd: 0, z: 0 } : {}) }
      : { mode: 'stick', hand: true, engaged: true, x: 0.4 * Math.sin(t), y: 0.5, gait: 'walk', deadzone: 0.35, runOn: 1.1 },
  };
}

let evSeq = 0;
function ev(type, data, position) { return { id: `stand-${++evSeq}`, type, position: position || { x: 0, y: 3, z: 0 }, data: data || {} }; }
const sched = [
  [0.3, () => S === 'zone' || S === 'explore' ? ev('zone_enter', { zoneId: 'bright-forest', name: 'Сияющий лес', subtitle: 'Земли, куда не дотянулось затмение' }) : null],
  [0.8, () => ev('boss_hit', { amount: 38, source: 'bolt', combo: 7 })],
  [1.3, () => ev('boss_hit', { amount: 142, source: 'rune', combo: 8 })],
  [1.6, () => ev('rune_cast', { rune: 'ignis' })],
  [2.1, () => ev('player_hit', { amount: 24 }, { x: 0, y: 1.2, z: 7 })],
  [2.6, () => ev('boss_hit', { amount: 61, source: 'burst', combo: 9 })],
  [3.0, () => ev('ember_lit', { id: 'ember-0', points: 3, lit: 2, total: 11 })],
  [3.4, () => ev('sigil_cast', { sigil: 'frame', bonus: 0.3, duration: 8 })],
];

// ---------------------------------------------------------------- модули
const uiRoot = document.getElementById('ao-ui-root');
const ui = createUI({ root: uiRoot, callbacks: {}, options: { keyboardPause: false, showVolume: false, abilityCosts: { bolt: 4, shield: 10, burst: 25 } } });
const hud = createBattleHud({ canvas: document.getElementById('ao-hud-canvas') });
const screen = S === 'paused' ? 'paused' : S === 'intro' ? 'intro' : 'playing';
let t = 0, last = performance.now(), fired = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (freezeT === null) t += dt; else t = freezeT;
  const events = [];
  while (fired < sched.length && sched[fired][0] <= t) { const e = sched[fired][1](); if (e) events.push(e); fired++; }
  if (freezeT === null) {
    const c = snap.cooldowns;
    for (const k of ['dash', 'burst', 'throw', 'spark', 'slash', 'parry']) c[k + 'Remaining'] = Math.max(0, c[k + 'Remaining'] - dt);
    for (const r of Object.values(c.runes)) r.remaining = Math.max(0, r.remaining - dt);
    for (const r of Object.values(c.sigils)) r.remaining = Math.max(0, r.remaining - dt);
    if (S === 'explore' || S === 'zone') { snap.player.position.z -= dt * 1.2; }
  }
  for (const e of events) {
    if (e.type === 'boss_hit') { if (pvp) snap.opponent.hp = Math.max(0, snap.opponent.hp - e.data.amount * 0.3); else snap.boss.hp = Math.max(0, snap.boss.hp - e.data.amount); }
    if (e.type === 'player_hit') snap.player.hp = Math.max(1, snap.player.hp - e.data.amount);
  }
  cam.x = snap.player.position.x; cam.z = snap.player.position.z + 4.5;
  paintScene(snap);
  const input = inputAt(t);
  ui.update({ screen: screen === 'intro' ? 'playing' : screen, snapshot: snap, tracking: { status: 'ready', confidence: 0.86, calibrated: true }, debug: false, settings, input, pauseReason: 'user' });
  uiRoot.classList.toggle('ao-intro', screen === 'intro');
  hud.frame({
    dtReal: freezeT === null ? dt : 0.016, timeScale: 1, screen, snapshot: snap, events, input, project,
    viewport: { w: innerWidth, h: innerHeight }, intro: { active: screen === 'intro', t: Math.min(t, 4), duration: 5 },
    settings, resumeLeftMs: 0, pois: LAYOUT.pois, layout: LAYOUT,
    coach: { hint: input.hint, accuracy: 82, good: 41, mistakes: 9 },
  });
  window.__STAND__ = { ready: t > 0.2, t, S };
}
requestAnimationFrame(frame);
</script>
</body>
</html>
