<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASHEN OATH — стенд HUD [W4-UI]</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="../modules/ui.css">
<style>
  /* [W4-UI] Стенд боевого HUD без WebGL: фальшивая 2D-сцена + настоящие ui.js (полосы, умения) и battleHud.js
     (числа урона, криты, лечение, «Ярость клятвы»). Сценарий повторяется каждые 8 с.
     Параметры: ?q=low|medium|high  &rm=1 (уменьшенное движение)  &bdo=0 (прежний вид)  &cheat=1 (шпаргалка видна)
     &outro=1|2 — финал «ПОБЕДА» / «РЕГЕНТ УСТОЯЛ» в конце круга */
  #ao-canvas { background: #0d0f14; }
</style>
</head>
<body>
<div id="ao-app">
  <canvas id="ao-canvas" aria-hidden="true"></canvas>
  <canvas id="ao-hud-canvas" aria-hidden="true"></canvas>
  <div id="ao-ui-root"></div>
</div>
<script type="module">
import { createUI } from '../modules/ui.js';
import { createBattleHud } from '../core/battleHud.js';
import { makeSnapshot } from './ui-fixtures.js';

const q = new URLSearchParams(location.search);
const rm = q.get('rm') === '1';
const settings = { quality: q.get('q') || 'high', volume: 0.6, reducedMotion: rm, sensitivity: 1, moveMode: 'steer', hero: 'ashen', bdoUi: q.get('bdo') !== '0' };
if (q.get('cheat') !== '1') { try { localStorage.setItem('ashen-oath.cheat.v1', '0'); } catch (e) { /* без хранилища */ } }

const canvas = document.getElementById('ao-canvas');
const cam = { x: 0, y: 2.8, z: 11.5 };
function project(p) {
  const W = innerWidth, H = innerHeight, depth = cam.z - p.z;
  const fpx = H * 0.9;
  return { x: W / 2 + ((p.x - cam.x) / Math.max(0.1, depth)) * fpx, y: H * 0.5 - (((p.y || 0) - cam.y + 0.4) / Math.max(0.1, depth)) * fpx, behind: depth <= 0.1 };
}
function paintScene(snap) {
  const dpr = Math.min(devicePixelRatio || 1, 1.5), W = innerWidth, H = innerHeight;
  if (canvas.width !== Math.round(W * dpr)) { canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr); }
  const g = canvas.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#1a2130'); sky.addColorStop(0.5, '#2c3240'); sky.addColorStop(0.62, '#1b1d22'); sky.addColorStop(1, '#0f1013');
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  g.fillStyle = 'rgba(255,214,150,0.10)'; g.beginPath(); g.arc(W * 0.5, H * 0.17, H * 0.07, 0, 6.3); g.fill();
  g.fillStyle = '#16181d';
  for (let i = 0; i < 11; i++) { const x = (i / 10) * W; const ch = H * (0.14 + (i % 3) * 0.06); g.fillRect(x - 12, H * 0.6 - ch, 24, ch); }
  g.fillStyle = '#2a2c31'; g.beginPath(); g.ellipse(W / 2, H * 0.8, W * 0.55, H * 0.24, 0, 0, 6.3); g.fill();
  const b = project({ ...snap.boss.position, y: 0 }), bt = project({ ...snap.boss.position, y: 6.5 });
  g.fillStyle = '#3a2420'; const bw = (b.y - bt.y) * 0.42; g.fillRect(b.x - bw / 2, bt.y, bw, b.y - bt.y);
  g.fillStyle = '#e07040'; g.beginPath(); g.arc(b.x, bt.y + (b.y - bt.y) * 0.3, bw * 0.12, 0, 6.3); g.fill();
  const h = project({ ...snap.player.position, y: 0 }), ht = project({ ...snap.player.position, y: 1.8 });
  g.fillStyle = '#5a6272'; const hw = (h.y - ht.y) * 0.36; g.fillRect(h.x - hw / 2, ht.y, hw, h.y - ht.y);
}

const snap = makeSnapshot({
  player: { position: { x: 0.6, y: 0, z: 6.5 }, hp: 74, energy: 58, encounter: 'engaged', lockedOn: true, combo: 6, comboMultiplier: 1.3, comboTimer: 2.4, fury: 35, furyMax: 100, furyReady: false },
  boss: { hp: 720, maxHp: 1000, stage: 1, action: 'idle' },
  cooldowns: { dashRemaining: 0, dashTotal: 1.2, burstRemaining: 0, burstTotal: 8 },
  telegraphs: [],
});
snap.lockTarget = { position: { x: 0, y: 0, z: 0 }, kind: 'boss' };

let seq = 0;
const ev = (type, data, position) => ({ id: `w4-${++seq}`, type, position: position || { x: 0, y: 3.2, z: 0 }, data: data || {} });
const HERO = () => ({ x: snap.player.position.x, y: 1.5, z: snap.player.position.z });
// сценарий 8 с: серия ударов (числа не наползают), крит, лечение, урон по герою, ярость до «готово»
const SCRIPT = [
  [0.4, () => [ev('boss_hit', { amount: 24, source: 'bolt', combo: 7 })]],
  [0.55, () => [ev('boss_hit', { amount: 26, source: 'bolt', combo: 8 })]],
  [0.7, () => [ev('boss_hit', { amount: 23, source: 'bolt', combo: 9 })]],
  [0.85, () => [ev('boss_hit', { amount: 27, source: 'bolt', combo: 10 })]],
  [1.4, () => [ev('burst', { power: 0.8 }), ev('boss_hit', { amount: 96, source: 'burst', multiplier: 1.3, combo: 11 })]],
  [2.1, () => [ev('boss_hit', { amount: 148, source: 'slash', recoverBonus: true, combo: 12 })]],
  [2.9, () => [ev('player_hit', { amount: 22 }, HERO())]],
  [3.6, () => { snap.player.hp = Math.min(100, snap.player.hp + 18); return [ev('rune_cast', { rune: 'orbis', heal: 18 })]; }],
  [4.3, () => [ev('boss_hit', { amount: 31, source: 'bolt', combo: 13 }), ev('boss_hit', { amount: 33, source: 'spark', combo: 14 })]],
  [5.0, () => [ev('boss_hit', { amount: 212, source: 'rune', charged: true, combo: 15 })]],
  [6.2, () => { snap.player.furyReady = true; snap.player.fury = 100; return [ev('ultimate_ready', {})]; }],
];
// &outro=1 — в конце круга финал «ПОБЕДА» (&outro=2 — «РЕГЕНТ УСТОЯЛ»)
if (q.get('outro')) SCRIPT.push([6.9, () => [ev(q.get('outro') === '2' ? 'defeat' : 'victory', { time: 102.3 })]]);
const ui = createUI({ root: document.getElementById('ao-ui-root'), callbacks: {}, options: { keyboardPause: false, showVolume: false, abilityCosts: { bolt: 4, shield: 10, burst: 25 } } });
const hud = createBattleHud({ canvas: document.getElementById('ao-hud-canvas') });
let t = 0, last = performance.now(), loopT = 0, fired = 0;
// QA: время battleHud.frame по настоящим часам (скрипты съёмки подменяют performance.now виртуальным)
const realNow = window.__realNow || (() => performance.now());
const QA = window.__W4__ = { hudMs: 0, frames: 0, ms: new Float64Array(4096), reset() { this.hudMs = 0; this.frames = 0; } };
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  t += dt; loopT += dt;
  if (loopT >= 8) {   // новый круг сценария
    loopT = 0; fired = 0; snap.player.hp = 74; snap.player.energy = 58; snap.player.fury = 35; snap.player.furyReady = false; snap.boss.hp = 720;
    snap.cooldowns.burstRemaining = 0; snap.cooldowns.dashRemaining = 0;
    hud.reset();   // как новый бой в игре: без «+N» за восстановленное здоровье
  }
  const events = [];
  while (fired < SCRIPT.length && SCRIPT[fired][0] <= loopT) { events.push(...SCRIPT[fired][1]()); fired++; }
  for (const e of events) {
    if (e.type === 'boss_hit') { snap.boss.hp = Math.max(0, snap.boss.hp - e.data.amount); if (!snap.player.furyReady) snap.player.fury = Math.min(99, snap.player.fury + e.data.amount * 0.08); }
    if (e.type === 'player_hit') snap.player.hp = Math.max(1, snap.player.hp - e.data.amount);
    if (e.type === 'burst') { snap.cooldowns.burstRemaining = 8; snap.player.energy -= 25; }
  }
  const c = snap.cooldowns;
  c.burstRemaining = Math.max(0, c.burstRemaining - dt);
  c.dashRemaining = Math.max(0, c.dashRemaining - dt);
  if (loopT > 3.1 && loopT < 3.2 && c.dashRemaining <= 0) c.dashRemaining = 1.2;
  snap.player.energy = Math.min(100, snap.player.energy + dt * 2);
  paintScene(snap);
  ui.update({ screen: 'playing', snapshot: snap, tracking: { status: 'ready', confidence: 0.86, calibrated: true }, debug: false, settings, input: null, pauseReason: 'user' });
  const t0 = realNow();
  hud.frame({
    dtReal: dt, timeScale: 1, screen: 'playing', snapshot: snap, events, input: null, project,
    viewport: { w: innerWidth, h: innerHeight }, intro: { active: false, t: 0, duration: 5 },
    settings, resumeLeftMs: 0, pois: [], layout: null, coach: null,
    ult: { fury: snap.player.fury, furyMax: 100, ready: snap.player.furyReady, gesture: null, debug: false, flash: 0, cine: null },
  });
  const dtHud = realNow() - t0;
  QA.hudMs += dtHud; QA.ms[QA.frames & 4095] = dtHud; QA.frames++;
  window.__STAND__ = { t, loopT };
}
requestAnimationFrame(frame);
</script>
</body>
</html>
