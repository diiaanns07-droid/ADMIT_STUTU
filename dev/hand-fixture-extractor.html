<!doctype html>
<!--
  ASHEN OATH — dev/hand-fixture-extractor.html. Стенд разработчика, не часть игры.
  Прогоняет НАСТОЯЩИЙ MediaPipe HandLandmarker 0.10.35 (главный поток, CPU или GPU) по списку
  картинок с того же origin и отдаёт landmarks в window.__HAND_FIXTURES__ — из них собираются
  фикстуры dev/fixtures/hands/*.json для тестов интерпретатора жестов.

  Запуск (из корня проекта):  python serve_game.py --no-browser --port 8950
    http://127.0.0.1:8950/dev/hand-fixture-extractor.html?list=fixtures/hands/img/list.json&auto=1
  Параметры адреса:
    ?delegate=CPU|GPU   делегат (по умолчанию CPU: детерминированнее в headless)
    ?hands=2            numHands;  ?minDet=0.5 ?minPres=0.5 ?minTrack=0.5 — пороги
    ?pose=1             дополнительно PoseLandmarker lite (запястья 15/16 для привязки рук к сторонам)
    ?list=<url>         JSON: массив URL или объектов { id, url, ... } (относительно страницы)
    ?auto=1             сразу обработать ?list в режиме IMAGE
  Программный API (CDP / консоль):
    await HandFixtureExtractor.ready
    await HandFixtureExtractor.extractImages([{ id, url }, ...])              // режим IMAGE
    await HandFixtureExtractor.extractSequence({ id, frames:[url...], fps })  // режим VIDEO
  Кадры НЕ зеркалятся: координаты в системе исходного изображения (mirrored:false).
  handedness — сырая метка MediaPipe; модель считает вход зеркальным (селфи), поэтому
  на незеркальном кадре метка обычно противоположна настоящей руке человека.
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASHEN OATH — извлечение фикстур рук</title>
<style>
  :root { --ash: #23262b; --panel: #2d3137; --line: #41464e; --text: #e4e1da; --dim: #9aa0a8; --ember: #c8a45a; --ok: #7fae8a; --bad: #c96a6a; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; background: var(--ash); color: var(--text); font: 15px/1.45 system-ui, "Segoe UI", sans-serif; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  p { margin: 0 0 12px; color: var(--dim); max-width: 80ch; }
  #status { padding: 8px 12px; border-left: 3px solid var(--line); background: var(--panel); margin-bottom: 12px; }
  #status[data-s="ready"], #status[data-s="done"] { border-color: var(--ok); }
  #status[data-s="error"] { border-color: var(--bad); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 12px; }
  textarea { width: min(640px, 100%); height: 90px; background: #1f2226; color: var(--text); border: 1px solid var(--line); font: 12px/1.4 ui-monospace, Consolas, monospace; padding: 6px; }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--line); padding: 7px 14px; font: inherit; cursor: pointer; border-radius: 3px; }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
  canvas { max-width: min(640px, 100%); height: auto; background: #1a1c20; border: 1px solid var(--line); }
  pre { background: #1f2226; border: 1px solid var(--line); padding: 8px; font: 12px/1.4 ui-monospace, Consolas, monospace; max-height: 260px; overflow: auto; white-space: pre-wrap; margin: 0; flex: 1 1 320px; }
</style>
</head>
<body>
<h1>Фикстуры рук: MediaPipe HandLandmarker 0.10.35</h1>
<p>Вставьте URL картинок с этого же сервера (по одному в строке) и нажмите «Обработать». Результат — в <code>window.__HAND_FIXTURES__</code> и кнопкой «Скачать JSON».</p>
<div id="status" data-s="loading"><b>loading</b> — загрузка MediaPipe…</div>
<div class="row">
  <textarea id="urls" spellcheck="false" aria-label="URL картинок"></textarea>
  <div>
    <button id="bRun" disabled>Обработать</button>
    <button id="bSave" disabled>Скачать JSON</button>
  </div>
</div>
<div class="row">
  <canvas id="view" width="640" height="480" aria-label="Последний кадр с landmarks"></canvas>
  <pre id="log"></pre>
</div>
<script type="module">
const MP_VERSION = '0.10.35'; // 1.0.x не использовать: в бандле есть телеметрия
const q = new URLSearchParams(location.search);
const num = (k, d) => { const v = Number(q.get(k)); return q.has(k) && Number.isFinite(v) ? v : d; };
const CFG = {
  moduleUrl: `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VERSION}/vision_bundle.mjs`,
  wasmRoot: `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VERSION}/wasm`,
  handModelUrl: q.get('model') || 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
  poseModelUrl: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',
  delegate: (q.get('delegate') || 'CPU').toUpperCase() === 'GPU' ? 'GPU' : 'CPU',
  numHands: Math.max(1, Math.min(4, Math.round(num('hands', 2)))),
  minHandDetectionConfidence: num('minDet', 0.5),
  minHandPresenceConfidence: num('minPres', 0.5),
  minTrackingConfidence: num('minTrack', 0.5),
  pose: q.get('pose') === '1',
};

const $ = (id) => document.getElementById(id);
const state = {
  status: 'loading', mediapipe: MP_VERSION, delegate: null, poseDelegate: null, config: { ...CFG },
  error: null, results: [], sequences: [], progress: { done: 0, total: 0 },
};
window.__HAND_FIXTURES__ = state;

const logLines = [];
function log(msg) {
  logLines.push(`${new Date().toISOString().slice(11, 23)}  ${msg}`);
  if (logLines.length > 300) logLines.shift();
  $('log').textContent = logLines.join('\n');
}
function setStatus(s, text) {
  state.status = s;
  const el = $('status');
  el.dataset.s = s;
  el.innerHTML = '';
  const b = document.createElement('b');
  b.textContent = s;
  el.append(b, ` — ${text}`);
}
const errText = (e) => String((e && (e.message || e.name)) || e || 'неизвестная ошибка');
const r5 = (v) => Math.round(v * 1e5) / 1e5;
const pt = (p) => ({ x: r5(p.x), y: r5(p.y), z: r5(p.z) });
const ptv = (p) => ({ x: r5(p.x), y: r5(p.y), z: r5(p.z), visibility: r5(p.visibility ?? 0) });

let vision = null; // { mod, fileset }
async function loadVision() {
  const mod = await import(CFG.moduleUrl);
  if (!mod.FilesetResolver || !mod.HandLandmarker) throw new Error('в модуле MediaPipe нет FilesetResolver/HandLandmarker');
  const fileset = await mod.FilesetResolver.forVisionTasks(CFG.wasmRoot);
  return { mod, fileset };
}

// GPU → при ошибке откат на CPU (как в modules/vision.js).
async function createTask(Klass, modelUrl, runningMode, extra) {
  const order = CFG.delegate === 'GPU' ? ['GPU', 'CPU'] : ['CPU'];
  let lastErr = null;
  for (const delegate of order) {
    try {
      const task = await Klass.createFromOptions(vision.fileset, { baseOptions: { modelAssetPath: modelUrl, delegate }, runningMode, ...extra });
      return { task, delegate, note: lastErr ? errText(lastErr) : null };
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('не удалось создать задачу MediaPipe');
}
const handOptions = () => ({
  numHands: CFG.numHands,
  minHandDetectionConfidence: CFG.minHandDetectionConfidence,
  minHandPresenceConfidence: CFG.minHandPresenceConfidence,
  minTrackingConfidence: CFG.minTrackingConfidence,
});
const poseOptions = () => ({ numPoses: 1, minPoseDetectionConfidence: 0.5, minPosePresenceConfidence: 0.5, minTrackingConfidence: 0.5 });

let imageHands = null; // IMAGE-режим создаётся один раз
let imagePose = null;

function loadImage(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.decoding = 'async';
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error(`картинка не загрузилась: ${url}`));
    img.src = new URL(url, location.href).href;
  });
}

function packHands(res) {
  const out = [];
  const lms = (res && res.landmarks) || [];
  const world = (res && res.worldLandmarks) || [];
  const hd = (res && (res.handedness || res.handednesses)) || [];
  for (let i = 0; i < lms.length; i++) {
    const cat = (hd[i] && hd[i][0]) || null;
    out.push({
      landmarks: lms[i].map(pt),
      worldLandmarks: world[i] ? world[i].map(pt) : null,
      handedness: cat ? cat.categoryName : null, // сырая метка MediaPipe (вход считается зеркальным)
      score: cat ? r5(cat.score) : null,
    });
  }
  return out;
}
function packPose(res) {
  const lm = res && res.landmarks && res.landmarks[0];
  if (!lm) return null;
  const w = res.worldLandmarks && res.worldLandmarks[0];
  return { landmarks: lm.map(ptv), worldLandmarks: w ? w.map(ptv) : null };
}

// ----------------------------------------------------------- отрисовка для глаз
const BONES = [[0, 1], [1, 2], [2, 3], [3, 4], [0, 5], [5, 6], [6, 7], [7, 8], [5, 9], [9, 10], [10, 11], [11, 12],
  [9, 13], [13, 14], [14, 15], [15, 16], [13, 17], [0, 17], [17, 18], [18, 19], [19, 20]];
function draw(img, hands, pose) {
  const c = $('view');
  const s = Math.min(1, 640 / Math.max(img.naturalWidth, img.naturalHeight));
  c.width = Math.round(img.naturalWidth * s);
  c.height = Math.round(img.naturalHeight * s);
  const g = c.getContext('2d');
  g.drawImage(img, 0, 0, c.width, c.height);
  g.lineWidth = 2;
  if (pose) {
    g.fillStyle = '#7fae8a';
    for (const i of [11, 12, 13, 14, 15, 16]) { const p = pose.landmarks[i]; g.fillRect(p.x * c.width - 3, p.y * c.height - 3, 6, 6); }
  }
  for (const h of hands) {
    g.strokeStyle = h.handedness === 'Left' ? '#c8a45a' : '#6fa8dc';
    g.beginPath();
    for (const [a, b] of BONES) {
      g.moveTo(h.landmarks[a].x * c.width, h.landmarks[a].y * c.height);
      g.lineTo(h.landmarks[b].x * c.width, h.landmarks[b].y * c.height);
    }
    g.stroke();
    g.fillStyle = '#e4e1da';
    for (const p of h.landmarks) g.fillRect(p.x * c.width - 2, p.y * c.height - 2, 4, 4);
  }
}

const normItem = (it, i) => (typeof it === 'string' ? { id: it.split('/').pop().replace(/\.[^.]+$/, '') || `img${i}`, url: it } : { ...it });

async function extractImages(items, opts = {}) {
  await ready;
  if (!imageHands) {
    imageHands = await createTask(vision.mod.HandLandmarker, CFG.handModelUrl, 'IMAGE', handOptions());
    state.delegate = imageHands.delegate;
    if (imageHands.note) log(`HandLandmarker: откат на ${imageHands.delegate} (${imageHands.note})`);
  }
  const wantPose = opts.pose ?? CFG.pose;
  if (wantPose && !imagePose) {
    imagePose = await createTask(vision.mod.PoseLandmarker, CFG.poseModelUrl, 'IMAGE', poseOptions());
    state.poseDelegate = imagePose.delegate;
  }
  const list = items.map(normItem);
  const out = [];
  setStatus('running', `IMAGE: 0/${list.length}`);
  state.progress = { done: 0, total: list.length };
  for (const it of list) {
    const rec = { ...it, mode: 'IMAGE', mirrored: false, frameW: 0, frameH: 0, hands: [], pose: null, inferMs: 0, error: null };
    try {
      const img = await loadImage(it.url);
      rec.frameW = img.naturalWidth;
      rec.frameH = img.naturalHeight;
      const t0 = performance.now();
      rec.hands = packHands(imageHands.task.detect(img));
      rec.inferMs = Math.round((performance.now() - t0) * 10) / 10;
      if (wantPose) rec.pose = packPose(imagePose.task.detect(img));
      draw(img, rec.hands, rec.pose);
      log(`${rec.id}: рук ${rec.hands.length}${rec.pose ? ', поза есть' : ''} (${rec.inferMs} мс)`);
    } catch (e) {
      rec.error = errText(e);
      log(`${rec.id}: ОШИБКА ${rec.error}`);
    }
    out.push(rec);
    state.results.push(rec);
    state.progress.done++;
    setStatus('running', `IMAGE: ${state.progress.done}/${list.length}`);
  }
  setStatus('done', `IMAGE: обработано ${out.length}, с руками ${out.filter((r) => r.hands.length).length}`);
  $('bSave').disabled = false;
  return out;
}

// VIDEO: на каждую последовательность — свой свежий landmarker (трекинг не тянется между роликами).
async function extractSequence(seq, opts = {}) {
  await ready;
  const fps = seq.fps || 15;
  const frames = seq.frames.map((f, i) => (typeof f === 'string' ? { url: f, tMs: Math.round((i * 1000) / fps) } : f));
  const hands = await createTask(vision.mod.HandLandmarker, CFG.handModelUrl, 'VIDEO', handOptions());
  const wantPose = opts.pose ?? CFG.pose;
  const pose = wantPose ? await createTask(vision.mod.PoseLandmarker, CFG.poseModelUrl, 'VIDEO', poseOptions()) : null;
  const { frames: _srcFrames, ...meta } = seq;
  const rec = { ...meta, mode: 'VIDEO', mirrored: false, fps, delegate: hands.delegate, frameW: 0, frameH: 0, frames: [], error: null };
  setStatus('running', `VIDEO ${seq.id}: 0/${frames.length}`);
  try {
    let lastTs = -1;
    for (const f of frames) {
      const img = await loadImage(f.url);
      rec.frameW = img.naturalWidth;
      rec.frameH = img.naturalHeight;
      const ts = Math.max(lastTs + 1, Math.round(f.tMs)); // строго возрастающие метки для detectForVideo
      lastTs = ts;
      const t0 = performance.now();
      const fr = { tMs: ts, hands: packHands(hands.task.detectForVideo(img, ts)), pose: null, inferMs: 0 };
      fr.inferMs = Math.round((performance.now() - t0) * 10) / 10;
      if (pose) fr.pose = packPose(pose.task.detectForVideo(img, ts));
      rec.frames.push(fr);
      if (rec.frames.length % 10 === 0 || rec.frames.length === frames.length) {
        draw(img, fr.hands, fr.pose);
        setStatus('running', `VIDEO ${seq.id}: ${rec.frames.length}/${frames.length}`);
      }
    }
  } catch (e) {
    rec.error = errText(e);
    log(`${seq.id}: ОШИБКА ${rec.error}`);
  } finally {
    try { hands.task.close(); } catch { /* ignore */ }
    try { if (pose) pose.task.close(); } catch { /* ignore */ }
  }
  const withHands = rec.frames.filter((f) => f.hands.length).length;
  log(`${seq.id}: кадров ${rec.frames.length}, с руками ${withHands}`);
  state.sequences.push(rec);
  setStatus('done', `VIDEO ${seq.id}: кадров ${rec.frames.length}, с руками ${withHands}`);
  $('bSave').disabled = false;
  return rec;
}

const ready = (async () => {
  try {
    const t0 = performance.now();
    vision = await loadVision();
    // Проверяем, что модель действительно создаётся в этом окружении (иначе ready → error).
    imageHands = await createTask(vision.mod.HandLandmarker, CFG.handModelUrl, 'IMAGE', handOptions());
    state.delegate = imageHands.delegate;
    state.loadMs = Math.round(performance.now() - t0);
    setStatus('ready', `HandLandmarker готов (${imageHands.delegate}${imageHands.note ? ', откат: ' + imageHands.note : ''}), ${state.loadMs} мс`);
    $('bRun').disabled = false;
    return true;
  } catch (e) {
    state.error = errText(e);
    setStatus('error', state.error);
    throw e;
  }
})();
ready.catch(() => {});

window.HandFixtureExtractor = { ready, extractImages, extractSequence, config: CFG, version: MP_VERSION };

$('bRun').addEventListener('click', async () => {
  const urls = $('urls').value.split(/\s+/).filter(Boolean);
  if (!urls.length) return;
  $('bRun').disabled = true;
  try { await extractImages(urls); } catch (e) { setStatus('error', errText(e)); } finally { $('bRun').disabled = false; }
});
$('bSave').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify({ mediapipe: MP_VERSION, delegate: state.delegate, results: state.results, sequences: state.sequences })], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'hand-fixtures-raw.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

if (q.get('list')) {
  (async () => {
    try {
      const r = await fetch(new URL(q.get('list'), location.href));
      if (!r.ok) throw new Error(`список ${q.get('list')}: HTTP ${r.status}`);
      const list = await r.json();
      $('urls').value = list.map((it) => (typeof it === 'string' ? it : it.url)).join('\n');
      if (q.get('auto') === '1') await extractImages(list);
    } catch (e) { log(`список: ${errText(e)}`); setStatus('error', errText(e)); }
  })();
}
</script>
</body>
</html>
