<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ashen Oath</title>
  <meta name="description" content="ASHEN OATH — браузерный бой с каменным стражем, управление веб-камерой.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d1016'/%3E%3Cpath d='M16 5 L25 27 H7 Z' fill='none' stroke='%23c9a45c' stroke-width='2.5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="modules/ui.css">
  <link rel="stylesheet" href="modules/coach.css">
  <!-- Three.js подключается ОДИН раз. Версия обязана совпадать с DEPS.three в config.js. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/",
      "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.min.js"
    }
  }
  </script>
  <script>
    // Загрузчик-страховка: показывает понятную ошибку вместо чёрного экрана.
    (function () {
      var failed = false;
      var timedOut = false;
      function show(msg) {
        var el = document.getElementById('ao-boot');
        if (!el) { document.addEventListener('DOMContentLoaded', function () { show(msg); }); return; }
        el.hidden = false;
        el.classList.add('is-error');
        el.querySelector('p').textContent = msg;
      }
      window.__aoBoot = {
        done: function () {
          clearTimeout(window.__aoBootTimer);
          var el = document.getElementById('ao-boot');
          if (el && (!failed || timedOut)) { el.hidden = true; failed = false; }
        },
        fail: function (msg) { failed = true; show(msg); }
      };
      if (location.protocol === 'file:') {
        failed = true;
        document.addEventListener('DOMContentLoaded', function () {
          show('Игра открыта как файл. Браузер так не загрузит модули и камеру. Закройте вкладку и запустите START_GAME.cmd из папки игры.');
        });
      }
      window.__aoModuleError = function () {
        window.__aoBoot.fail('Не удалось загрузить код игры или Three.js. Проверьте интернет-подключение (библиотеки загружаются с cdn.jsdelivr.net) и обновите страницу (F5).');
      };
      window.__aoBootTimer = setTimeout(function () {
        if (!window.__ASHEN__ && !failed) { window.__aoBoot.fail('Игра не запустилась за 25 секунд. Проверьте интернет и обновите страницу (F5). Подробности — в консоли (F12).'); timedOut = true; }
      }, 25000);
      // [PERF] частота экрана, пока грузятся модули и ничего тяжёлого не рисуется: в бою браузер под
      // нагрузкой зовёт rAF реже, и по игровым кадрам 165 Гц не отличить от 70. Читает core/perfTuner.js.
      (function () {
        var dts = [], last = 0;
        function tick(t) {
          if (last) { var d = t - last; if (d > 2.5 && d < 50) dts.push(d); }
          last = t;
          if (dts.length < 45 && !window.__ASHEN__) requestAnimationFrame(tick);
          else if (dts.length >= 12) { dts.sort(function (a, b) { return a - b; }); window.__aoRefreshHz = 1000 / dts[dts.length >> 1]; }
        }
        requestAnimationFrame(tick);
      })();
      // Ошибка разбора/выполнения модуля (SyntaxError и т.п.) до старта — показать сразу, а не ждать 25 с.
      window.addEventListener('error', function (e) {
        if (window.__ASHEN__ || failed) return;
        var src = (e && e.filename) || '';
        if (src && src.indexOf(location.origin) !== 0) return;
        window.__aoBoot.fail('Ошибка в коде игры: ' + ((e && e.message) || 'неизвестная') + (src ? '\n' + src.replace(location.origin, '') + ':' + (e.lineno || '') : '') + '\nСообщите разработчику; подробности — в консоли (F12).');
      });
    })();
  </script>
</head>
<body>
  <div id="ao-app">
    <canvas id="ao-canvas" aria-label="Игровая сцена"></canvas>
    <canvas id="ao-hud-canvas" aria-hidden="true"></canvas>
    <div id="ao-ui-root"></div>
    <!-- Единственные video и overlay. main.js переносит их в слот камеры ui.js (ui-camera-slot). -->
    <div id="ao-media-holder">
      <video id="ao-video" playsinline muted></video>
      <canvas id="ao-overlay" aria-hidden="true"></canvas>
    </div>
    <div id="ao-boot">
      <div class="ao-boot-card">
        <h1>ASHEN OATH</h1>
        <p>Загрузка…</p>
      </div>
    </div>
    <noscript><div class="ao-noscript">Для игры нужен JavaScript.</div></noscript>
  </div>
  <script type="module" src="main.js" onerror="window.__aoModuleError()"></script>
</body>
</html>
