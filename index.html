  <script>
    // [OFFLINE] Запасной вариант: ?cdn=1 — библиотеки с cdn.jsdelivr.net вместо vendor/. Срабатывает и сам,
    // если код не загрузился (см. __aoModuleError). Первая карта импорта главнее следующей, поэтому она здесь.
    (function () {
      if (!/[?&]cdn=1(&|$)/.test(location.search)) return;
      var cdn = 'https://cdn.jsdelivr.net/npm/';
      document.write('<script type="importmap">' + JSON.stringify({ imports: {
        'three': cdn + 'three@0.185.1/build/three.module.min.js',
        'three/addons/': cdn + 'three@0.185.1/examples/jsm/',
        '@pixiv/three-vrm': cdn + '@pixiv/three-vrm@3.5.5/lib/three-vrm.module.min.js'
      } }) + '<\/script>');
    })();
  </script>
  <!-- Three.js подключается ОДИН раз. Версия обязана совпадать с DEPS.three в config.js.
       [OFFLINE] Всё из vendor/ (tools/vendor_update.mjs): игра стартует без интернета. -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/npm/three@0.185.1/build/three.module.min.js",
      "three/addons/": "./vendor/npm/three@0.185.1/examples/jsm/",
      "@pixiv/three-vrm": "./vendor/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.min.js"
    }
  }
  </script>
  <!-- [W5-СТАРТ] Модель героя и библиотека клипов качаются со старта main.js (warmHero в modules/heroModel.js), а не с первых
       миллисекунд страницы: на канале 8 Мбит/с они (≈1 МБ) шли раньше кода игры и сдвигали меню на ≈1 с, а нужны позже —
       после построения мира. -->
  <script>
    // Загрузчик-страховка: показывает понятную ошибку вместо чёрного экрана.
    // [OFFLINE] и настоящий прогресс загрузки: байты и файлы кода, подпись — что именно грузится.
    (function () {
      var failed = false;
      var timedOut = false;
      var domReady = false;
      // Объём стартовой загрузки (статические импорты main.js + стили). Обновляет tools/sw_manifest.mjs.
      var BOOT = /*AO_BOOT*/{"bytes":3993400,"files":64,"big":["vendor/npm/three@0.185.1/build/three.core.min.js","vendor/npm/three@0.185.1/build/three.module.min.js","modules/world.js"]}/*/AO_BOOT*/;
      var prog = { bytes: 0, files: 0, pct: 0, label: 'Код игры', lastT: Date.now(), startT: Date.now(), done: {} };
      var seen = {};
      function el(id) { return document.getElementById(id); }
      function show(msg) {
        var b = el('ao-boot');
        if (!b) { document.addEventListener('DOMContentLoaded', function () { show(msg); }); return; }
        b.hidden = false;
        b.classList.add('is-error');
        b.querySelector('p').textContent = msg;
      }
      function labelFor(u) {
        var f = u.split('?')[0];
        if (/three[.-](core|module)/.test(f)) return 'Three.js — 3D-движок';
        if (/three-vrm/.test(f)) return 'Модели героев (VRM)';
        if (/examples\/jsm\//.test(f)) return 'Three.js: загрузчики и эффекты';
        if (/\/fonts\//.test(f) || /\.woff2$/.test(f)) return 'Шрифты';
        if (/\.css$/.test(f)) return 'Оформление';
        if (/\/modules\/(world|atmosphere|brightForest|elfVillage)/.test(f)) return 'Мир: плато и лес';
        if (/\/modules\/(hero|characterLooks|vrmKit)/.test(f)) return 'Герои';
        if (/\/modules\/(fx|effects)/.test(f) || /\/modules\/fx\//.test(f)) return 'Магия и эффекты';
        if (/\/modules\/(boss|combat)/.test(f)) return 'Бой и страж';
        if (/\/modules\/vision|\/core\/(hand|steer|leftStick|bow|squat|pushup)/.test(f)) return 'Управление камерой';
        if (/\/net\/|pvp|netLobby|remotePlayer/.test(f)) return 'Дуэль';
        if (/\/modules\/ui|\/core\/(bdo|battleHud|trackingHud)/.test(f)) return 'Интерфейс';
        return 'Код игры';
      }
      function render() {
        if (failed && !timedOut) return;
        var b = el('ao-boot');
        if (!b) return;
        var fb = BOOT.bytes > 0 ? prog.bytes / BOOT.bytes : 0;
        var fc = BOOT.files > 0 ? prog.files / BOOT.files : 0;
        // байты главнее (Three.js — треть объёма), файлы страхуют, если размер браузер не сообщил
        var f = prog.bytes > 0 ? 0.75 * Math.min(1, fb) + 0.25 * Math.min(1, fc) : Math.min(1, fc);
        var pct = Math.max(prog.pct, Math.min(99, Math.round(f * 100)));
        prog.pct = pct;
        var bar = b.querySelector('.ao-boot-bar');
        if (bar) { bar.firstChild.style.width = pct + '%'; bar.setAttribute('aria-valuenow', String(pct)); }
        // что грузится сейчас: крупный файл старта, которого ещё нет (браузер сообщает только о готовых)
        var label = prog.label;
        if (fb >= 0.4 && BOOT.big) for (var i = 0; i < BOOT.big.length; i++) if (!prog.done[BOOT.big[i]]) { label = labelFor(BOOT.big[i]); break; }
        var what = b.querySelector('.ao-boot-what');
        if (what) what.textContent = pct >= 97 ? 'Сборка мира и героев…' : 'Загрузка · ' + label;
        var pc = b.querySelector('.ao-boot-pct');
        if (pc) pc.textContent = pct + '%';
      }
      function onEntry(e) {
        var u = e.name || '';
        if (seen[u] || u.indexOf('data:') === 0) return;
        if (u.indexOf(location.origin) !== 0 && !/cdn\.jsdelivr\.net|fonts\.(gstatic|googleapis)\.com/.test(u)) return;
        seen[u] = 1;
        if (BOOT.big) for (var i = 0; i < BOOT.big.length; i++) if (u.split('?')[0].slice(-BOOT.big[i].length) === BOOT.big[i]) prog.done[BOOT.big[i]] = 1;
        prog.bytes += e.decodedBodySize || e.encodedBodySize || 0;
        prog.files++;
        prog.lastT = Date.now();
        prog.label = labelFor(u);
        render();
      }
      try {
        var po = new PerformanceObserver(function (list) { list.getEntries().forEach(onEntry); });
        po.observe({ type: 'resource', buffered: true });
        window.__aoBootObserver = po;
      } catch (e) { /* старый браузер: просто «Загрузка…» */ }
      document.addEventListener('DOMContentLoaded', function () { domReady = true; render(); });

      window.__aoBoot = {
        done: function () {
          clearTimeout(window.__aoBootTimer);
          prog.pct = 100; render();
          try { if (window.__aoBootObserver) window.__aoBootObserver.disconnect(); } catch (e) { /* ignore */ }
          var b = el('ao-boot');
          if (b && (!failed || timedOut)) { b.hidden = true; failed = false; }
          window.__aoBootMs = Date.now() - prog.startT;
        },
        fail: function (msg) { failed = true; show(msg); },
        progress: function () { return { pct: prog.pct, bytes: prog.bytes, files: prog.files, label: prog.label }; }
      };
      if (location.protocol === 'file:') {
        failed = true;
        document.addEventListener('DOMContentLoaded', function () {
          show('Игра открыта как файл. Браузер так не загрузит модули и камеру. Закройте вкладку и запустите START_GAME.cmd из папки игры.');
        });
      }
      // Код не загрузился. vendor/ не выложен (404) — те же библиотеки с CDN (?cdn=1); сбой сети или
      // сервера — ещё одна попытка (?retry=1); не помогло — понятное сообщение и кнопка «Обновить».
      function failLoad() {
        window.__aoBoot.fail('Не удалось загрузить код игры. Обновите страницу. Если игра запущена через START_GAME.cmd — проверьте, что окно сервера открыто; если по ссылке — нужна сеть хотя бы для первого запуска.');
      }
      window.__aoModuleError = function () {
        if (location.protocol === 'file:') return;
        var q = location.search;
        var has = function (k) { return new RegExp('[?&]' + k + '=1(&|$)').test(q); };
        var go = function (k) { location.replace(location.pathname + (q ? q + '&' : '?') + k + '=1' + location.hash); };
        if (has('cdn')) { failLoad(); return; }
        fetch('vendor/npm/three@0.185.1/build/three.module.min.js', { method: 'HEAD', cache: 'no-store' }).then(function (r) {
          if (r.status === 404) go('cdn');
          else if (!has('retry')) go('retry');
          else failLoad();
        }, function () { if (!has('retry')) go('retry'); else failLoad(); });
      };
      window.__aoReload = function () {
        location.replace(location.pathname + location.search.replace(/[?&](retry|cdn)=1(?=&|$)/g, '').replace(/^&/, '?') + location.hash);
      };
      // [OFFLINE] 25 с — не приговор: пока файлы продолжают приходить, ждём и пишем, что сеть медленная.
      // Ошибка — только если загрузка встала (45 с без единого файла) или код загрузился, но игра не стартовала.
      function checkBoot() {
        if (window.__ASHEN__ || failed) return;
        var idle = Date.now() - prog.lastT;
        if (!domReady && idle < 45000) {
          var m = document.querySelector('#ao-boot .ao-boot-msg');
          if (m) m.textContent = 'Медленная сеть — загрузка продолжается. Следующий запуск будет мгновенным: игра сохранится на этом компьютере.';
          window.__aoBootTimer = setTimeout(checkBoot, 5000);
          return;
        }
        window.__aoBoot.fail(domReady
          ? 'Игра не запустилась. Обновите страницу (F5). Подробности — в консоли (F12).'
          : 'Загрузка остановилась: сеть не отвечает. Проверьте подключение и обновите страницу (F5).');
        timedOut = true;
      }
      window.__aoBootTimer = setTimeout(checkBoot, 25000);
      // [PERF] частота экрана, пока грузятся модули и ничего тяжёлого не рисуется: в бою браузер под
      // нагрузкой зовёт rAF реже, и по игровым кадрам 165 Гц не отличить от 70. Читает core/perfTuner.js.
      (function () {
        var dts = [], last = 0;
        function tick(t) {
          if (last) { var d = t - last; if (d > 2.5 && d < 50) dts.push(d); }
          last = t;
          if (dts.length < 45 && !window.__ASHEN__) requestAnimationFrame(tick);
          else if (dts.length >= 12) { dts.sort(function (a, b) { return a - b; }); window.__aoRefreshHz = 1000 / dts[dts.length >> 1]; }
        }
        requestAnimationFrame(tick);
      })();
      // Ошибка разбора/выполнения модуля (SyntaxError и т.п.) до старта — показать сразу, а не ждать 25 с.
      window.addEventListener('error', function (e) {
        if (window.__ASHEN__ || failed) return;
        var src = (e && e.filename) || '';
        if (src && src.indexOf(location.origin) !== 0) return;
        window.__aoBoot.fail('Ошибка в коде игры: ' + ((e && e.message) || 'неизвестная') + (src ? '\n' + src.replace(location.origin, '') + ':' + (e.lineno || '') : '') + '\nСообщите разработчику; подробности — в консоли (F12).');
      });
    })();
  </script>
